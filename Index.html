<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles/style.css">
    <title>Economic Monopoly</title>
</head>
<body>
    <header>
        <img src="assets/materials/menu-open.png" alt="menu" class="menu-button"/>
    </header>
    <main>
        <div class="field">
            <div class="center">
                <div class="field-center">
                    <div class="center-new"></div>
                </div>
            </div>
        </div>

        <div class="player-panel">
            <h1 class="player-panel__title">
                Manager card
            </h1>
            <div class="player-panel__info">
                <h3 class="player-panel__info__name">
                    Player name: 
                </h3>
                <p class="player-panel__info__item" data-title="Client №: " data-value="0"></p>
                <p class="player-panel__info__item" data-title="Image: " data-value="0"></p>
                <p class="player-panel__info__item" data-title="Commodity stock: " data-value="0"></p>
                <p class="player-panel__info__item" data-title="Money: $ " data-value="0"></p>

                <table>
                    <caption>
                        Information about company shares
                    </caption>
                    <thead>
                        <tr>
                            <th>Companies</th>
                            <th>Number of shares</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>

                <p class="player-panel__info__item" data-title="Debts: $ " data-value="0"></p>
        </div>
    </main>
    
    <script type="module" src="assets/scripts/script.js"></script>
</body>
</html>
