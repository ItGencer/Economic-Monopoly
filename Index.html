<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles/style.css">
    <title>Economic Monopoly</title>
</head>
<body>
    <header>
        <img src="assets/materials/menu-open.png" alt="menu"/>
    </header>
    <main>
        <div class="field">
            <div class="center">
                <div class="field-center">
                    <div class="center-new"></div>
                </div>
            </div>
        </div>

        <div class="player-panel">
            <h1 class="player-panel__title">
                Manager card
            </h1>
            <div class="player-panel__info">
                <h3 class="player-panel__info__name">
                    Player name: Player 1
                </h3>
                <p>
                    <span>Client:</span> № 0
                </p>
                <p>
                    <span>Image:</span> 0
                </p>
                <p>
                    <span>Commodity stock:</span> 0
                </p>
                <p>
                    <span>Money:</span> $1500
                </p>

                <table>
                    <caption>
                        Information about company shares
                    </caption>
                    <thead>
                        <tr>
                            <th>Companies</th>
                            <th>Number of shares</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Aerofactory</td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>Building</td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>Clining</td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>Radio Studio</td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>Travel Agency</td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td>TV factory</td>
                            <td>0</td>
                        </tr>
                    </tbody>
                </table>

                <p>
                    <span>Debts:</span> $0
                </p>
        </div>
    </main>
    <script src="assets/scripts/field.js"></script>
</body>
</html>
